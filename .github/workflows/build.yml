name: Build & Release APK

on:
  push:
    branches: [ main ]    # pre-release on every push to main
    tags:
      - 'v*'              # full release on version tags (v1.0.0, etc.)
  pull_request:
    branches: [ main ]
  workflow_dispatch:       # allows manual runs from the Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK (main push / PRs / manual)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Build release APK (tags)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease --no-daemon

      - name: Upload debug APK artifact (PRs / manual)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 14

      # On every push to main, update the rolling "latest" pre-release
      - name: Publish latest pre-release (main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Latest Debug Build"
          body: "Automatically updated on every push to `main`. This is a debug build — not a stable release."
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: "composeApp/build/outputs/apk/debug/*.apk"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: composeApp/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
